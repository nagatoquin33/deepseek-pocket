name: Feature request
description: 提一个功能或体验改进建议
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前可以先看 [README 的「与官方 Demo 对照」](https://github.com/nagatoquin33/deepseek-pocket#14-与官方开源-demo-的对照)，
        确认是否已在计划中（如消息分支、继续生成、中英双语）。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的使用场景 / 痛点
      description: 先讲问题，再讲方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 对话与渲染
        - 搜索 / 引用
        - 语音
        - 会话与数据
        - Android APK（手势 / 权限 / 通知）
        - 服务端 / 部署
        - 文档
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考实现
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与
      options:
        - label: 我愿意提交 PR
