name: build-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Unit tests (server + renderer)
        run: npm test

  apk:
    name: build-apk
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          ls "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools" || true
          ls "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms" || true

      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.0" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "版本: ${VERSION_NAME:-1.0.0} (${GITHUB_RUN_NUMBER})"

      - name: Build signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash android/build.sh

      - name: Checksums
        run: sha256sum android/dist/*.apk | tee android/dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DeepSeekPocket-apk
          path: |
            android/dist/*.apk
            android/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/dist/*.apk
            android/dist/SHA256SUMS.txt
          generate_release_notes: true

