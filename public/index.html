<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://api.deepseek.com; base-uri 'self'" />
<meta name="theme-color" content="#FFFFFF" />
<meta name="app-version" content="1.0.3" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="DeepSeek" />
<meta name="description" content="DeepSeek 随身版 —— 使用你自己的开放平台额度：深度思考、智能搜索、语音与多会话管理。" />
<meta name="format-detection" content="telephone=no" />
<title>DeepSeek</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/deepseek-mark.png" type="image/png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="stylesheet" href="./css/app.css" />
<script src="./vendor/mermaid.min.js"></script>
</head>
<body>
<div id="app" class="app">

  <!-- ================================ 登录 ================================ -->
  <section id="login" class="screen login" aria-label="登录">
    <div class="login-inner">
      <img class="brand-mark" src="./icons/deepseek-mark.png" width="78" height="78" alt="DeepSeek" />
      <h1 class="login-title">DeepSeek</h1>
      <p class="login-sub">随身版 · 使用你自己的开放平台额度</p>

      <div class="login-card">
        <button id="login-env" class="btn primary lg block" hidden>一键登录</button>
        <div id="login-env-hint" class="login-env-hint" hidden>已检测到本机预置密钥，点上方按钮即可进入</div>

        <div id="login-manual" class="login-manual">
          <label class="field-label" for="login-key">开放平台 API Key</label>
          <div class="key-row">
            <input id="login-key" class="input" type="password" inputmode="text" autocomplete="off"
                   autocapitalize="off" spellcheck="false" placeholder="sk-xxxxxxxxxxxxxxxx" />
            <button id="login-paste" class="btn ghost sm" type="button">粘贴</button>
          </div>
          <button id="login-submit" class="btn primary lg block" type="button">校验并登录</button>
        </div>

        <div class="login-divider"><span>或</span></div>
        <div class="login-alt">
          <button id="login-demo" class="btn ghost block" type="button" hidden>离线演示模式</button>
          <a class="btn ghost block" href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">打开开放平台获取密钥</a>
        </div>
        <p class="login-note" id="login-note">密钥仅保存在本机；所有请求直连 <code>api.deepseek.com</code>，按开放平台价格从你的账户额度扣费。</p>
      </div>

      <div id="login-status" class="login-status" role="status" aria-live="polite"></div>
      <p class="login-foot">DeepSeek 开放平台 · 无第三方登录授权，故采用密钥登录</p>
    </div>
  </section>

  <!-- ================================ 主界面 ================================ -->
  <section id="main" class="screen main" hidden>
    <header class="topbar" id="topbar">
      <button id="btn-menu" class="icon-btn" type="button" aria-label="会话列表" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M3.5 8.5h17M3.5 15.5h11"/></svg>
      </button>
      <button id="btn-model" class="model-chip" type="button" aria-haspopup="dialog">
        <span id="chip-model" class="chip-model">Deepseek Chat</span>
        <svg class="chip-caret" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m7 10 5 5 5-5"/></svg>
        <span id="chip-title" class="chip-title"></span>
      </button>
      <div class="topbar-right">
        <button id="btn-call" class="icon-btn" type="button" aria-label="语音输入">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h2.2l1.5 4-2 1.4a13 13 0 0 0 6.9 6.9l1.4-2 4 1.5v2.2a2.6 2.6 0 0 1-2.6 2.6C10.7 20.1 3.9 13.3 3.9 6.1a2.6 2.6 0 0 1 2.6-2.6Z"/></svg>
        </button>
        <button id="btn-speaker" class="icon-btn" type="button" aria-label="自动朗读" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3.5v6h3L11 19V5Z"/><path d="m15.5 9.5 5 5M20.5 9.5l-5 5"/></svg>
        </button>
        <button id="btn-new" class="icon-btn" type="button" aria-label="新建对话">
          <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><path d="M12 8.6v6.8M8.6 12h6.8"/></svg>
        </button>
      </div>
    </header>

    <main id="view" class="view">
      <div id="welcome" class="welcome">
        <div class="welcome-inner">
          <img class="welcome-mark" src="./icons/deepseek-mark.png" width="88" height="88" alt="" />
          <h2 class="welcome-title">嗨！今天想聊些什么？</h2>
          <div id="suggestions" class="suggestions" hidden></div>
        </div>
      </div>
      <div id="messages" class="messages" aria-live="polite" aria-relevant="additions text"></div>
      <button id="btn-scroll-bottom" class="scroll-bottom" type="button" aria-label="回到底部" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </main>

    <div id="composer-wrap" class="composer-wrap">
      <div id="attachments" class="attachments" hidden></div>
      <div id="composer" class="composer">
        <textarea id="input" class="input-area" rows="1" placeholder="发消息或按住说话"
                  aria-label="消息输入框" enterkeyhint="send"></textarea>
        <div class="composer-tools">
          <button id="btn-thinking" class="pill" type="button" aria-pressed="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.2c1.6 2.6 3.2 4.2 5.8 5.8-2.6 1.6-4.2 3.2-5.8 5.8-1.6-2.6-3.2-4.2-5.8-5.8 2.6-1.6 4.2-3.2 5.8-5.8Z"/><path d="M17.6 15.6c.8 1.3 1.6 2.1 2.9 2.9-1.3.8-2.1 1.6-2.9 2.9-.8-1.3-1.6-2.1-2.9-2.9 1.3-.8 2.1-1.6 2.9-2.9Z"/></svg>
            <span>深度思考</span>
          </button>
          <button id="btn-websearch" class="pill" type="button" aria-pressed="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.4"/><path d="M3.6 12h16.8M12 3.6c2.3 2.5 3.5 5.3 3.5 8.4s-1.2 5.9-3.5 8.4c-2.3-2.5-3.5-5.3-3.5-8.4s1.2-5.9 3.5-8.4Z"/></svg>
            <span>智能搜索</span>
          </button>
          <div class="composer-spacer"></div>
          <button id="btn-attach" class="circle-btn" type="button" aria-label="上传图片或文档">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 8.4v7.2M8.4 12h7.2"/></svg>
          </button>
          <button id="btn-voice" class="circle-btn" type="button" aria-label="按住说话">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.4v3.2M12 7.4a1.6 1.6 0 0 1 1.6 1.6v2a1.6 1.6 0 1 1-3.2 0v-2A1.6 1.6 0 0 1 12 7.4Z"/><path d="M9 12.4a3 3 0 0 0 6 0M12 15.4v1.6"/></svg>
          </button>
          <button id="btn-send" class="send-btn" type="button" aria-label="发送" disabled>
            <svg class="i-send" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
          </button>
        </div>
      </div>
      <p class="disclaimer">内容由 AI 生成，请仔细甄别</p>
    </div>

    <!-- 会话侧栏 -->
    <div id="scrim" class="scrim" hidden></div>
    <aside id="sidebar" class="sidebar" aria-label="会话列表" aria-hidden="true">
      <div class="side-search">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.6"/><path d="m20 20-3.7-3.7"/></svg>
        <input id="history-search" class="input bare" type="search" placeholder="搜索对话内容..." autocomplete="off" />
      </div>
      <div class="session-list" id="session-list"></div>
      <div class="sidebar-foot">
        <button id="btn-account" class="account-row" type="button">
          <span class="avatar" id="side-avatar">D</span>
          <span class="account-name" id="side-name">DeepSeek 用户</span>
          <span class="account-more">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
          </span>
        </button>
      </div>
    </aside>

    <!-- 录音浮层 -->
    <div id="recorder" class="recorder" hidden>
      <div class="rec-card" role="dialog" aria-modal="true" aria-label="语音输入">
        <div class="rec-head">
          <span class="rec-dot"></span>
          <span id="rec-title">正在聆听…</span>
          <span id="rec-time" class="rec-time">00:00</span>
        </div>
        <div class="rec-wave" id="rec-wave" aria-hidden="true"></div>
        <p class="rec-hint" id="rec-hint">松开结束并发送；也可点「完成」</p>
        <div class="rec-actions">
          <button id="rec-cancel" class="btn ghost" type="button">取消</button>
          <button id="rec-done" class="btn primary" type="button">完成</button>
        </div>
      </div>
    </div>

  </section>

  <div id="overlay-root"></div>
  <div id="toast-box" class="toast-box"></div>
  <div id="boot-error" class="boot-error" hidden></div>
</div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
